<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIRO — organize o rolê</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f5f4ef;--cd:#fff;--tx:#14181f;--mu:#6a7280;--bd:#e4e2da;--in:#f0eee8;--g:#00b85c;--gt:#fff;--r:#e5383b;--rs:#fde8e8;--gs:#dcf8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--cd:#171c24;--tx:#f2f3f5;--mu:#8d97a6;--bd:#262d38;--in:#1e2530;--rs:#3a1c1e;--gs:#123423}}
:root[data-theme=dark]{--bg:#0e1116;--cd:#171c24;--tx:#f2f3f5;--mu:#8d97a6;--bd:#262d38;--in:#1e2530;--rs:#3a1c1e;--gs:#123423}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,sans-serif;padding-bottom:96px}
main{max-width:520px;margin:0 auto;padding:16px}
h1,h2,.rv,.big{font-family:'Bricolage Grotesque',Inter,system-ui,sans-serif}
.hero h1{font-size:64px;line-height:.9;margin:8px 0 6px;letter-spacing:-3px;font-weight:800}
.hero h1 span{color:var(--g);letter-spacing:-1px;font-size:32px}
.hero p{margin:0 0 18px;color:var(--mu);font-size:18px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode{border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:18px;padding:14px 10px;font:600 14px Inter,sans-serif;text-align:left;min-height:88px}
.mode b{display:block;font-size:30px;margin-bottom:4px}
.mode.on{border-color:var(--g);box-shadow:0 0 0 3px var(--gs)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;background:var(--in);border:2px solid transparent;color:var(--tx);border-radius:12px;padding:13px;font:16px Inter,sans-serif;min-height:48px}
input:focus,select:focus{outline:none;border-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--g);color:var(--gt);font:800 17px 'Bricolage Grotesque',Inter,sans-serif;cursor:pointer}
.btn.alt{background:var(--in);color:var(--tx);font-size:15px;min-height:46px}
.btn.wa{background:#25d366;color:#04230f;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h2{margin:0;font-size:28px;letter-spacing:-1px;line-height:1.05}
.sub{color:var(--mu);font-size:14px;margin-top:4px}
.bar{height:10px;background:var(--in);border-radius:9px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--g)}
.kp{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}.kp b{color:var(--tx)}
.row{border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.rt.o{grid-template-columns:1fr auto auto auto}.cf{background:var(--rs);border-radius:12px;padding:10px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.back{border:0;background:none;color:var(--mu);font:700 14px Inter,sans-serif;padding:8px 0;min-height:44px}
.rt{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;cursor:pointer}
.rv{font-size:18px;font-weight:800}
.tag{font-size:12px;color:var(--mu);margin-left:6px}
.pill{border:0;border-radius:99px;padding:9px 12px;font:700 13px Inter,sans-serif;min-height:40px}
.pill.ok{background:var(--gs);color:var(--g)}.pill.no{background:var(--rs);color:var(--r)}
.pn{padding:0 0 14px}.pn textarea{width:100%;height:76px;background:var(--in);color:var(--tx);border:0;border-radius:12px;padding:10px;font:12px monospace;margin:8px 0}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:14px;width:fit-content;margin:6px auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--bd);background:transparent;color:var(--tx);border-radius:99px;padding:7px 11px;font:600 13px Inter,sans-serif}
.chip.off{opacity:.45;text-decoration:line-through}
.wait{opacity:.6}
.it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd);gap:10px}
.it:first-child{border-top:0}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--bd);background:none;color:var(--g);font-weight:800}
.done{text-decoration:line-through;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:170px;border:0;background:none;color:var(--mu);font:700 12px Inter,sans-serif;padding:8px 2px;border-radius:12px;min-height:48px}
nav button.on{background:var(--in);color:var(--tx)}
.x{border:0;background:none;color:var(--r);font-weight:700;padding:8px 0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;display:none}
.note{font-size:13px;color:var(--mu);margin:8px 0 0}
.rc{background:var(--cd);border:2px dashed var(--bd);border-radius:18px;padding:18px;margin-bottom:12px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd)}
.ln i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.ln.tt{border:0;font:800 24px 'Bricolage Grotesque',Inter,sans-serif;padding-top:14px}
.pp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:6px}
.pp div{background:var(--gs);border-radius:12px;padding:10px}.pp small{display:block;color:var(--mu);font-size:12px}.pp b{font:800 18px 'Bricolage Grotesque',Inter,sans-serif}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.g4 label{font-size:11px}.g4 input{padding:10px 6px;font-size:15px}
</style></head><body><main id="app"></main><div id="toast"></div>
<script>
const T={churrasco:{i:'🥩',n:'Churrasco / Resenha'},bar:{i:'🎂',n:'Aniversário / Bar'},futebol:{i:'⚽',n:'Futebol / Pelada'},vaquinha:{i:'🎁',n:'Vaquinha / Presente'}};
const ITEMS=[{n:'Carne',u:'kg',p:45,w:[.4,.3,.15]},{n:'Linguiça e pão de alho',u:'kg',p:30,w:[.1,.1,.05]},{n:'Cerveja',u:'lata',p:4.5,w:[6,3,0]},{n:'Refri e suco',u:'L',p:7,w:[.5,.5,.8]},{n:'Gelo',u:'kg',p:2,w:[.5,.5,.3]},{n:'Carvão e extras',u:'un',p:3,w:[1,1,0]}];
const TP=['Homem','Mulher','Criança'];
let S=null,own=false,tab='g',op=-1,cf=-1,cm='churrasco';
const A=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const fd=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const qty=(q,u)=>(u=='kg'||u=='L'?Math.ceil(q*10-1e-6)/10:Math.ceil(q-1e-6))+u;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function pix(amt){let k=(S.pk||'').trim();if(S.pt=='cpf')k=k.replace(/\D/g,'');else if(S.pt=='tel'){k=k.replace(/\D/g,'');if(!(k.startsWith('55')&&k.length>=12))k='55'+k;k='+'+k}
const a=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim();
let p=f('00','01')+f('01','11')+f('26',f('00','br.gov.bcb.pix')+f('01',k))+f('52','0000')+f('53','986')+(amt>0?f('54',amt.toFixed(2)):'')+f('58','BR')+f('59',a(S.org).slice(0,25)||'GIRO')+f('60','BRASIL')+f('62',f('05','***'))+'6304';return p+crc(p)}
function calc(){const P=S.p;let items=[];P.forEach(p=>{p.v=0;p.w=false});
if(S.m=='churrasco'){items=S.it.map((it,i)=>{let q=0;P.forEach(p=>{if(!(p.off||[]).includes(i)){const w=it.w[p.t||0];q+=w;p.v+=w*it.p}});return{...it,i,q,cost:q*it.p}})}
else if(S.m=='bar'){const k=1+(S.tx||0)/100;P.forEach(p=>p.v=(+p.c||0)*k);const b=P.find(p=>p.b);if(b&&S.bm!='nao'){const sh=b.v;b.v=0;if(S.bm=='dividir'){const o=P.filter(p=>p!==b);o.forEach(p=>p.v+=sh/(o.length||1))}}}
else if(S.m=='futebol'){const n=Math.min(P.length,S.lim)||1;P.forEach((p,i)=>{if(i<S.lim)p.v=TT()/n;else p.w=true})}
else P.forEach(p=>p.v=TT()/(P.length||1));
P.forEach(p=>p.v=Math.ceil(p.v*100-1e-6)/100);
const a=P.filter(p=>!p.w);return{items,tot:a.reduce((s,p)=>s+p.v,0),got:a.filter(p=>p.paid).reduce((s,p)=>s+p.v,0)}}
function save(){try{localStorage.setItem('giro:'+S.id,JSON.stringify(S));localStorage.setItem('giro:last',S.id);if(own)localStorage.setItem('giro:own:'+S.id,'1')}catch(e){}try{history.replaceState(null,'','#e='+enc(S))}catch(e){}}
const link=()=>location.href.split('#')[0]+'#e='+enc(S);
function init(){if(/t=o/.test(location.hash))tab='o';const h=location.hash.match(/e=([^&]+)/);if(h){try{S=dec(h[1])}catch(e){}}
if(S){try{own=!!localStorage.getItem('giro:own:'+S.id);const l=localStorage.getItem('giro:'+S.id);if(own&&l)S=JSON.parse(l)}catch(e){}}R()}
function R(){A.innerHTML=S?ev():home();if(S)document.querySelector('nav')||0;if(S&&op>=0&&typeof QRCode!='undefined'){const q=document.getElementById('qr');if(q){q.innerHTML='';new QRCode(q,{text:pix(S.p[op].v),width:176,height:176})}}}
function home(){let last=null;try{last=localStorage.getItem('giro:last')&&JSON.parse(localStorage.getItem('giro:'+localStorage.getItem('giro:last')))}catch(e){}
const ex={churrasco:'',bar:`<label>Taxa de serviço (%)<input id="tx" type="number" value="10"></label>`,futebol:`<div class="two"><label>Vagas<input id="lim" type="number" value="14"></label><label>Valor da quadra (R$)<input id="tot" type="number" value="140"></label></div>`,vaquinha:`<label>Meta (R$)<input id="tot" type="number" placeholder="300"></label>`}[cm];
return `<div class="hero"><h1>GIRO<span>.to</span></h1><p>Rolê organizado em 30 segundos. Sem cadastro.</p></div>
<div class="modes">${Object.entries(T).map(([k,v])=>`<button class="mode ${k==cm?'on':''}" onclick="cm='${k}';R()"><b>${v.i}</b>${v.n}</button>`).join('')}</div>
<div class="card"><label>Nome do rolê<input id="nm" placeholder="Ex: Churrasco do Zé"></label>
<div class="two"><label>Data<input id="dt" type="date"></label><label>Local<input id="lc" placeholder="Casa do Zé"></label></div>${ex}
<label>Seu nome (organizador)<input id="org" placeholder="Zé"></label>
<div class="two"><label>Tipo da chave Pix<select id="pt"><option value="cpf">CPF/CNPJ</option><option value="tel">Celular</option><option value="email">E-mail</option><option value="rand">Aleatória</option></select></label><label>Chave Pix<input id="pk" placeholder="Sua chave"></label></div>
<button class="btn" onclick="mk()">Criar rolê e gerar link 🚀</button></div>
${last?`<button class="btn alt" onclick="S=${'JSON.parse(localStorage.getItem(\'giro:\'+localStorage.getItem(\'giro:last\')))'};own=true;tab='g';save();R()">Continuar: ${esc(last.nm)}</button>`:''}`}
function mk(){const v=i=>(document.getElementById(i)||{}).value;const nm=v('nm').trim(),org=v('org').trim();if(!nm||!org||!v('pk').trim())return toast('Preencha nome, organizador e chave Pix');
S={id:Math.random().toString(36).slice(2,8),m:cm,nm,dt:v('dt'),lc:v('lc'),org,pt:v('pt'),pk:v('pk'),tx:+v('tx')||10,lim:+v('lim')||14,tot:+v('tot')||0,bm:'dividir',bt:[],it:JSON.parse(JSON.stringify(ITEMS)),p:[{n:org,t:0,c:0,paid:true,off:[]}]};own=true;tab='g';op=-1;save();R()}
function ev(){const c=calc(),n=S.p.filter(p=>!p.w).length,pc=c.tot?Math.round(c.got/c.tot*100):0;
const tabs=[['g','👥 Galera'],['c','🧾 Itens'],['o','📋 Resumo']].concat(own?[['a','⚙️ Ajustes']]:[]);
return `<button class="back" onclick="goHome()">← Início</button><div class="card"><div class="top"><div><h2>${T[S.m].i} ${esc(S.nm)}</h2><div class="sub">${esc([fd(S.dt),S.lc].filter(Boolean).join(' · '))}</div></div><div class="big" style="font-size:22px;font-weight:800">${brl(c.tot)}</div></div>
<div class="bar"><i style="width:${pc}%"></i></div><div class="kp"><span>Recebido <b>${brl(c.got)}</b></span><span>Falta <b>${brl(c.tot-c.got)}</b></span></div></div>
${{g:galera,c:custos,o:orc,a:ajustes}[tab](c)}
${tab=='o'?'':`<button class="btn wa" onclick="tab='o';op=-1;R();scrollTo(0,0)">📲 Enviar resumo</button>`}
<nav>${tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';op=-1;R()">${t[1]}</button>`).join('')}</nav>`}
function galera(){return `<div class="card">${S.p.map((p,i)=>`<div class="row ${p.w?'wait':''}"><div class="rt${own?' o':''}" onclick="op=${op==i?-1:i};R()"><div><b>${esc(p.n)}</b>${p.b?' 🎂':''}<span class="tag">${p.w?'lista de espera':S.m=='churrasco'?TP[p.t||0]:S.m=='bar'?brl(p.c):''}</span></div><div class="rv">${p.w?'—':brl(p.v)}</div>
<button class="pill ${p.paid?'ok':'no'}" onclick="event.stopPropagation();${own?`tg(${i})`:''}">${p.paid?'🟢 Pago':'🔴 Pendente'}</button>${own?`<button class="x" style="padding:8px 4px" aria-label="Remover" onclick="event.stopPropagation();cf=${i};op=-1;R()">✕</button>`:''}</div>${cf==i?`<div class="cf"><b style="flex:1">Remover ${esc(p.n)}?</b><button class="pill" style="background:var(--r);color:#fff" onclick="rm(${i})">Sim, remover</button><button class="pill" style="background:var(--in);color:var(--tx)" onclick="cf=-1;R()">Cancelar</button></div>`:''}${op==i?panel(p,i):''}</div>`).join('')}</div>
${own?`<div class="card"><label>Adicionar pessoa<input id="an" placeholder="Nome"></label>${S.m=='churrasco'?`<label>Tipo<select id="at">${TP.map((t,i)=>`<option value="${i}">${t}</option>`).join('')}</select></label>`:''}${S.m=='bar'?`<label>Consumo (R$)<input id="ac" type="number" placeholder="0"></label>`:''}<button class="btn" onclick="ad()">+ Adicionar</button></div>`:''}`}
function panel(p,i){let h='<div class="pn">';
if(!p.w&&p.v>0)h+=`<div id="qr"></div><textarea readonly onclick="this.select()">${pix(p.v)}</textarea><button class="btn" onclick="cp(pix(S.p[${i}].v),'Pix copiado!')">Copiar Pix Copia e Cola</button>`;
if(own){if(S.m=='churrasco')h+=`<div class="sub" style="margin-top:12px">Toque para tirar o que essa pessoa não consome:</div><div class="chips">${S.it.map((it,k)=>`<button class="chip ${(p.off||[]).includes(k)?'off':''}" onclick="ofx(${i},${k})">${esc(it.n)}</button>`).join('')}</div>`;
if(S.m=='bar')h+=`<label style="margin-top:12px">Consumo (R$)<input type="number" value="${p.c||''}" onchange="S.p[${i}].c=+this.value;save();R()"></label><button class="chip" onclick="bd(${i})">${p.b?'🎂 É o aniversariante (tocar para remover)':'🎂 Marcar como aniversariante'}</button>`;
}
return h+'</div>'}
function custos(c){let h='<div class="card">';
if(S.m=='churrasco'){h+=(c.items.map(x=>`<div class="it"><div class="${S.bt.includes(x.i)?'done':''}"><b>${esc(x.n)}</b><div class="sub">${qty(x.q,x.u)} × ${brl(x.p)}/${x.u}</div></div><div style="display:flex;gap:8px;align-items:center"><b>${brl(x.cost)}</b>${own?`<button class="ck" onclick="bt(${x.i})">${S.bt.includes(x.i)?'✓':''}</button><button class="x" onclick="ri(${x.i})">✕</button>`:''}</div></div>`).join('')||'<p class="note">Nenhum item ainda.</p>')+`<p class="note">Cada um paga só o que consome. ✓ marca o que já foi comprado.</p></div>`;
if(own)h+=`<div class="card"><b>Novo item</b><label style="margin-top:8px">Nome<input id="ni" placeholder="Ex: Picanha"></label><div class="two"><label>Unidade<select id="nu"><option>kg</option><option>L</option><option>lata</option><option>un</option></select></label><label>Preço por unidade (R$)<input id="np" type="number" step=".1"></label></div><div class="g4" style="grid-template-columns:repeat(3,1fr)"><label>Por homem<input id="n0" type="number" step=".05"></label><label>Por mulher<input id="n1" type="number" step=".05"></label><label>Por criança<input id="n2" type="number" step=".05"></label></div><button class="btn" style="margin-top:12px" onclick="ai()">+ Adicionar item</button></div>`;return h}
if(S.m=='bar')return h+`<div class="it"><span>Consumo total</span><b>${brl(S.p.reduce((s,p)=>s+(+p.c||0),0))}</b></div><div class="it"><span>Taxa de serviço</span><b>${S.tx}%</b></div><div class="it"><span>Parte do aniversariante</span><b>${{nao:'Cada um paga o seu',dividir:'Galera racha',abater:'Cortesia'}[S.bm]}</b></div></div>`;
const ex=S.ex||[],n=S.p.filter(p=>!p.w).length;
h+=ex.map((e,k)=>`<div class="it"><b>${esc(e.n)}</b><div style="display:flex;gap:8px;align-items:center"><b>${brl(e.v)}</b>${own?`<button class="x" onclick="re(${k})">✕</button>`:''}</div></div>`).join('')+(ex.length?'':`<div class="it"><span>${S.m=='futebol'?'Quadra':'Meta'}</span><b>${brl(S.tot)}</b></div>`)+(S.m=='futebol'?`<div class="it"><span>Vagas</span><b>${n}/${S.lim}</b></div>`:`<div class="it"><span>Participantes</span><b>${n}</b></div>`)+`<div class="it"><span>Por pessoa</span><b>${brl(S.p[0]?S.p[0].v:0)}</b></div></div>`;
if(own)h+=`<div class="card"><b>Novo item de custo</b><div class="two" style="margin-top:8px"><label>Nome<input id="ne" placeholder="${S.m=='futebol'?'Bola, colete...':'Presente, bolo...'}"></label><label>Valor (R$)<input id="nv" type="number"></label></div><button class="btn" onclick="ae()">+ Adicionar item</button><p class="note">Com itens, o total passa a ser a soma deles.</p></div>`;
return h}
function fl(l,k,t='text'){return `<label>${l}<input type="${t}" value="${esc(S[k])}" onchange="S['${k}']=this.type=='number'?+this.value:this.value;save();R()"></label>`}
function ajustes(){let h=`<div class="card">${fl('Nome do rolê','nm')}<div class="two">${fl('Data','dt','date')}${fl('Local','lc')}</div>${fl('Organizador','org')}
<div class="two"><label>Tipo do Pix<select onchange="S.pt=this.value;save();R()">${[['cpf','CPF/CNPJ'],['tel','Celular'],['email','E-mail'],['rand','Aleatória']].map(o=>`<option value="${o[0]}" ${S.pt==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>${fl('Chave Pix','pk')}</div>`;
if(S.m=='bar')h+=fl('Taxa de serviço (%)','tx','number')+`<label>Parte do aniversariante<select onchange="S.bm=this.value;save();R()">${[['nao','Cada um paga o seu'],['dividir','Galera racha a parte dele'],['abater','Abater (cortesia)']].map(o=>`<option value="${o[0]}" ${S.bm==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>`;
if(S.m=='futebol')h+=`<div class="two">${fl('Vagas','lim','number')}${fl('Valor da quadra','tot','number')}</div>`;
if(S.m=='vaquinha')h+=fl('Meta (R$)','tot','number');
if(S.m=='churrasco')h+=`<div class="sub">Itens: preço e quantidade por pessoa</div>`+S.it.map((it,k)=>`<div style="margin-top:10px"><label>Item<input value="${esc(it.n)}" onchange="ei(${k},'n',this.value)"></label><div class="g4"><label>R$/${it.u}<input type="number" step=".1" value="${it.p}" onchange="ei(${k},'p',this.value)"></label>${TP.map((t,j)=>`<label>${t}<input type="number" step=".05" value="${it.w[j]}" onchange="ei(${k},'w${j}',this.value)"></label>`).join('')}</div></div>`).join('');
return h+'</div>'}
const tg=i=>{S.p[i].paid=!S.p[i].paid;save();R()};
const rm=i=>{S.p.splice(i,1);op=-1;cf=-1;save();R()};
const bt=k=>{const j=S.bt.indexOf(k);j<0?S.bt.push(k):S.bt.splice(j,1);save();R()};
const ofx=(i,k)=>{const o=S.p[i].off=S.p[i].off||[],j=o.indexOf(k);j<0?o.push(k):o.splice(j,1);save();R()};
const bd=i=>{const b=!S.p[i].b;S.p.forEach(p=>p.b=false);S.p[i].b=b;save();R()};
function ad(){const n=document.getElementById('an').value.trim();if(!n)return toast('Digite o nome');const g=i=>document.getElementById(i);S.p.push({n,t:g('at')?+g('at').value:0,c:g('ac')?+g('ac').value||0:0,paid:false,off:[]});save();R()}
function msg(pv){const c=calc(),a=S.p.filter(p=>!p.w),pg=a.filter(p=>p.paid),pd=a.filter(p=>!p.paid),wl=S.p.filter(p=>p.w);
let t=`${T[S.m].i} *${S.nm}*\n`;if(wh())t+=`📍 ${wh()}\n`;
if(S.m!='bar')t+=`\n🛒 *Itens*\n`+lines(c).map(l=>`• ${l.n}${l.d?' ('+l.d+')':''}: ${brl(l.v)}`).join('\n')+'\n';
t+=`\n💰 *Total: ${brl(c.tot)}* | Recebido: *${brl(c.got)}*\n`;const pp=per(c).map(x=>x[1]?`${x[0]}: *${x[1]}*`:'').filter(Boolean).join(' · ');if(pp)t+=pp+'\n';
if(pg.length)t+=`\n🟢 *Pagos (${pg.length})*\n`+pg.map(p=>`✅ ${p.n}`).join('\n')+'\n';
if(pd.length)t+=`\n🔴 *Pendentes (${pd.length})*\n`+pd.map(p=>`• ${p.n}: ${brl(p.v)}`).join('\n')+'\n';
if(wl.length)t+=`\n⏳ *Lista de espera:* ${wl.map(p=>p.n).join(', ')}\n`;
if(S.m=='churrasco'){const fa=c.items.filter(x=>x.q>0&&!S.bt.includes(x.i));if(fa.length)t+=`\n🛍️ *Falta comprar:* `+fa.map(x=>`${x.n} ${qty(x.q,x.u)}`).join(', ')+'\n'}
return t+`\n💸 Pix: ${S.pk} (${S.org})\n🔗 ${pv?'link do rolê (vai junto na mensagem)':link()+'&t=o'}`}
function wa(){window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg()),'_blank')}
function cp(t,m){try{navigator.clipboard.writeText(t).then(()=>toast(m),()=>fb(t,m))}catch(e){fb(t,m)}}
function fb(t,m){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');toast(m)}catch(e){toast('Copie manualmente')}x.remove()}
const TT=()=>S.ex&&S.ex.length?S.ex.reduce((s,e)=>s+e.v,0):S.tot;
function ei(k,f,v){const it=S.it[k];if(f=='n')it.n=v;else if(f=='p')it.p=+v;else it.w[+f[1]]=+v;save();R()}
function ri(k){const fx=a=>(a||[]).filter(j=>j!=k).map(j=>j>k?j-1:j);S.it.splice(k,1);S.bt=fx(S.bt);S.p.forEach(p=>p.off=fx(p.off));save();R()}
function ai(){const g=i=>document.getElementById(i).value,n=g('ni').trim(),p=+g('np');if(!n||!p)return toast('Informe nome e preço');S.it.push({n,u:g('nu'),p,w:[+g('n0')||0,+g('n1')||0,+g('n2')||0]});save();R()}
function ae(){const n=document.getElementById('ne').value.trim(),v=+document.getElementById('nv').value;if(!n||!v)return toast('Informe nome e valor');(S.ex=S.ex||[]).push({n,v});save();R()}
const re=k=>{S.ex.splice(k,1);save();R()};
function lines(c){if(S.m=='churrasco')return c.items.filter(x=>x.q>0).map(x=>({n:x.n,d:qty(x.q,x.u),v:x.cost}));
if(S.m=='bar')return S.p.map(p=>({n:p.n+(p.b?' 🎂':''),d:'consumo '+brl(p.c),v:p.v}));
return S.ex&&S.ex.length?S.ex.map(e=>({n:e.n,d:'',v:e.v})):[{n:S.m=='futebol'?'Quadra':'Meta',d:'',v:S.tot}]}
function per(c){const n=S.p.filter(p=>!p.w).length||1;
if(S.m=='churrasco')return[0,1,2].map(t=>[TP[t],S.it.reduce((s,it)=>s+it.w[t]*it.p,0)]).filter(x=>x[1]>0).map(x=>[x[0]+' paga',brl(x[1])]);
if(S.m=='bar')return[['Pessoas',''+n],['Média',brl(c.tot/n)]];
return[[S.m=='futebol'?'Vagas':'Pessoas',S.m=='futebol'?n+'/'+S.lim:''+n],['Por pessoa',brl(S.p[0]?S.p[0].v:0)]]}
const wh=()=>[fd(S.dt),S.lc].filter(Boolean).join(' · ');
function orc(){const t=esc(msg(1)).replace(/\*(.+?)\*/g,'<b>$1</b>');return `<div class="rc"><div class="sub">Prévia do resumo · é isso que vai no WhatsApp</div><div style="white-space:pre-wrap;margin-top:10px;line-height:1.6">${t}</div></div><button class="btn wa" onclick="wa()">📲 Enviar no WhatsApp</button><button class="btn alt" style="margin:8px 0 12px" onclick="cp(msg(),'Resumo copiado!')">Copiar texto</button>`}
function goHome(){S=null;op=-1;cf=-1;tab='g';try{history.replaceState(null,'',location.href.split('#')[0])}catch(e){}R();scrollTo(0,0)}
init();
</script></body></html>
